<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: html">
<head>
    <title>Patrons - Library Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Patrons</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatronModal">
                <i class="bi bi-plus-lg"></i> Add Patron
            </button>
        </div>

        <!-- Search Form -->
        <form class="row g-3 mb-4" th:action="@{/lms/api/v1/patrons}" method="get">
            <div class="col-md-12">
                <input type="text" class="form-control" name="name" placeholder="Search by name" th:value="${param.name}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <!-- Patrons Table -->
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Cell Number</th>
                        <th>Address</th>
                        <th>City</th>
                        <th>Country</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patron : ${patrons}">
                        <td th:text="${patron.name}"></td>
                        <td th:text="${patron.cellNumber}"></td>
                        <td th:text="${patron.addressLine1}"></td>
                        <td th:text="${patron.city}"></td>
                        <td th:text="${patron.country}"></td>
                        <td>
                            <button class="btn btn-sm btn-primary" th:onclick="'editPatron(' + ${patron.patronId} + ')'">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" th:onclick="'deletePatron(' + ${patron.patronId} + ')'">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Patron Modal -->
        <div class="modal fade" id="addPatronModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Patron</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/patron}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cell Number</label>
                                <input type="text" class="form-control" name="cellNumber" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address Line 1</label>
                                <input type="text" class="form-control" name="addressLine1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" name="city" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" class="form-control" name="country" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Patron Modal -->
        <div class="modal fade" id="editPatronModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Patron</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/patron/{id}(id=${patron.patronId})}" method="put">
                        <div class="modal-body">
                            <input type="hidden" name="patronId">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Cell Number</label>
                                <input type="text" class="form-control" name="cellNumber" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Address Line 1</label>
                                <input type="text" class="form-control" name="addressLine1" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">City</label>
                                <input type="text" class="form-control" name="city" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Country</label>
                                <input type="text" class="form-control" name="country" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function editPatron(patronId) {
            // Fetch patron details and populate the edit form
            fetch(`/lms/api/v1/patron/${patronId}`)
                .then(response => response.json())
                .then(patron => {
                    const form = document.querySelector('#editPatronModal form');
                    form.querySelector('[name="patronId"]').value = patron.patronId;
                    form.querySelector('[name="name"]').value = patron.name;
                    form.querySelector('[name="cellNumber"]').value = patron.cellNumber;
                    form.querySelector('[name="addressLine1"]').value = patron.addressLine1;
                    form.querySelector('[name="city"]').value = patron.city;
                    form.querySelector('[name="country"]').value = patron.country;
                    new bootstrap.Modal(document.getElementById('editPatronModal')).show();
                });
        }

        function deletePatron(patronId) {
            if (confirm('Are you sure you want to delete this patron?')) {
                fetch(`/lms/api/v1/patron/${patronId}`, {
                    method: 'DELETE'
                }).then(() => window.location.reload());
            }
        }
    </script>
</body>
</html>
