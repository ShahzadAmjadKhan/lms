<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: html">
<head>
    <title>Books - Library Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Books</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">
                <i class="bi bi-plus-lg"></i> Add Book
            </button>
        </div>

        <!-- Search Form -->
        <form class="row g-3 mb-4" th:action="@{/lms/api/v1/books}" method="get">
            <div class="col-md-4">
                <input type="text" class="form-control" name="title" placeholder="Search by title" th:value="${param.title}">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" name="author" placeholder="Search by author" th:value="${param.author}">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" name="genre" placeholder="Search by genre" th:value="${param.genre}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <!-- Books Table -->
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Genre</th>
                        <th>ISBN</th>
                        <th>Available</th>
                        <th>Total</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.title}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${book.genre}"></td>
                        <td th:text="${book.isbn}"></td>
                        <td th:text="${book.availableQuantity}"></td>
                        <td th:text="${book.totalQuantity}"></td>
                        <td>
                            <button class="btn btn-sm btn-primary" th:onclick="'editBook(' + ${book.bookId} + ')'">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" th:onclick="'deleteBook(' + ${book.bookId} + ')'">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Book Modal -->
        <div class="modal fade" id="addBookModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Book</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/book}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" name="title" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <input type="text" class="form-control" name="author" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Genre</label>
                                <input type="text" class="form-control" name="genre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ISBN</label>
                                <input type="text" class="form-control" name="isbn" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Quantity</label>
                                <input type="number" class="form-control" name="totalQuantity" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Available Quantity</label>
                                <input type="number" class="form-control" name="availableQuantity" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Book Modal -->
        <div class="modal fade" id="editBookModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Book</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/book/{id}(id=${book.bookId})}" method="put">
                        <div class="modal-body">
                            <input type="hidden" name="bookId">
                            <div class="mb-3">
                                <label class="form-label">Title</label>
                                <input type="text" class="form-control" name="title" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Author</label>
                                <input type="text" class="form-control" name="author" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Genre</label>
                                <input type="text" class="form-control" name="genre" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">ISBN</label>
                                <input type="text" class="form-control" name="isbn" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Total Quantity</label>
                                <input type="number" class="form-control" name="totalQuantity" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Available Quantity</label>
                                <input type="number" class="form-control" name="availableQuantity" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function editBook(bookId) {
            // Fetch book details and populate the edit form
            fetch(`/lms/api/v1/book/${bookId}`)
                .then(response => response.json())
                .then(book => {
                    const form = document.querySelector('#editBookModal form');
                    form.querySelector('[name="bookId"]').value = book.bookId;
                    form.querySelector('[name="title"]').value = book.title;
                    form.querySelector('[name="author"]').value = book.author;
                    form.querySelector('[name="genre"]').value = book.genre;
                    form.querySelector('[name="isbn"]').value = book.isbn;
                    form.querySelector('[name="totalQuantity"]').value = book.totalQuantity;
                    form.querySelector('[name="availableQuantity"]').value = book.availableQuantity;
                    new bootstrap.Modal(document.getElementById('editBookModal')).show();
                });
        }

        function deleteBook(bookId) {
            if (confirm('Are you sure you want to delete this book?')) {
                fetch(`/lms/api/v1/book/${bookId}`, {
                    method: 'DELETE'
                }).then(() => window.location.reload());
            }
        }
    </script>
</body>
</html>
