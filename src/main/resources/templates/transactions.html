<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: html">
<head>
    <title>Transactions - Library Management System</title>
</head>
<body>
    <div th:fragment="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Transactions</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
                <i class="bi bi-plus-lg"></i> Add Transaction
            </button>
        </div>

        <!-- Search Form -->
        <form class="row g-3 mb-4" th:action="@{/lms/api/v1/transactions}" method="get">
            <div class="col-md-6">
                <input type="text" class="form-control" name="bookId" placeholder="Search by Book ID" th:value="${param.bookId}">
            </div>
            <div class="col-md-6">
                <input type="text" class="form-control" name="patronId" placeholder="Search by Patron ID" th:value="${param.patronId}">
            </div>
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Search</button>
            </div>
        </form>

        <!-- Transactions Table -->
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Book ID</th>
                        <th>Patron ID</th>
                        <th>Status</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Fine Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="transaction : ${transactions}">
                        <td th:text="${transaction.bookId}"></td>
                        <td th:text="${transaction.patronId}"></td>
                        <td th:text="${transaction.status}"></td>
                        <td th:text="${#temporals.format(transaction.issueDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${#temporals.format(transaction.dueDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${transaction.returnDate != null ? #temporals.format(transaction.returnDate, 'yyyy-MM-dd') : ''}"></td>
                        <td th:text="${transaction.fineAmount}"></td>
                        <td>
                            <button class="btn btn-sm btn-primary" th:onclick="'editTransaction(' + ${transaction.transactionId} + ')'">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" th:onclick="'deleteTransaction(' + ${transaction.transactionId} + ')'">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Add Transaction Modal -->
        <div class="modal fade" id="addTransactionModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Add Transaction</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/transaction}" method="post">
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Book ID</label>
                                <input type="text" class="form-control" name="bookId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Patron ID</label>
                                <input type="text" class="form-control" name="patronId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-control" name="status" required>
                                    <option value="Borrowed">Borrowed</option>
                                    <option value="Returned">Returned</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Issue Date</label>
                                <input type="date" class="form-control" name="issueDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="dueDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Return Date</label>
                                <input type="date" class="form-control" name="returnDate">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fine Amount</label>
                                <input type="text" class="form-control" name="fineAmount">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Comments</label>
                                <textarea class="form-control" name="comments"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Edit Transaction Modal -->
        <div class="modal fade" id="editTransactionModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Edit Transaction</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <form th:action="@{/lms/api/v1/transaction/{id}(id=${transaction.transactionId})}" method="put">
                        <div class="modal-body">
                            <input type="hidden" name="transactionId">
                            <div class="mb-3">
                                <label class="form-label">Book ID</label>
                                <input type="text" class="form-control" name="bookId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Patron ID</label>
                                <input type="text" class="form-control" name="patronId" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-control" name="status" required>
                                    <option value="Borrowed">Borrowed</option>
                                    <option value="Returned">Returned</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Issue Date</label>
                                <input type="date" class="form-control" name="issueDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Due Date</label>
                                <input type="date" class="form-control" name="dueDate" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Return Date</label>
                                <input type="date" class="form-control" name="returnDate">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Fine Amount</label>
                                <input type="text" class="form-control" name="fineAmount">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Comments</label>
                                <textarea class="form-control" name="comments"></textarea>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                            <button type="submit" class="btn btn-primary">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function editTransaction(transactionId) {
            // Fetch transaction details and populate the edit form
            fetch(`/lms/api/v1/transaction/${transactionId}`)
                .then(response => response.json())
                .then(transaction => {
                    const form = document.querySelector('#editTransactionModal form');
                    form.querySelector('[name="transactionId"]').value = transaction.transactionId;
                    form.querySelector('[name="bookId"]').value = transaction.bookId;
                    form.querySelector('[name="patronId"]').value = transaction.patronId;
                    form.querySelector('[name="status"]').value = transaction.status;
                    form.querySelector('[name="issueDate"]').value = transaction.issueDate;
                    form.querySelector('[name="dueDate"]').value = transaction.dueDate;
                    form.querySelector('[name="returnDate"]').value = transaction.returnDate || '';
                    form.querySelector('[name="fineAmount"]').value = transaction.fineAmount || '';
                    form.querySelector('[name="comments"]').value = transaction.comments || '';
                    new bootstrap.Modal(document.getElementById('editTransactionModal')).show();
                });
        }

        function deleteTransaction(transactionId) {
            if (confirm('Are you sure you want to delete this transaction?')) {
                fetch(`/lms/api/v1/transaction/${transactionId}`, {
                    method: 'DELETE'
                }).then(() => window.location.reload());
            }
        }
    </script>
</body>
</html>
