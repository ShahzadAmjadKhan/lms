<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .book-card {
            transition: transform 0.2s;
        }
        .book-card:hover {
            transform: translateY(-5px);
        }
        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Library Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="/lms/books.html">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/patrons.html">Patrons</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/transactions.html">Transactions</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Books</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addBookModal">
                <i class="bi bi-plus-lg"></i> Add Book
            </button>
        </div>

        <div class="row" id="booksList">
            <!-- Books will be loaded here -->
        </div>
    </div>

    <!-- Add Book Modal -->
    <div class="modal fade" id="addBookModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addBookForm">
                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>
                        <div class="mb-3">
                            <label for="author" class="form-label">Author</label>
                            <input type="text" class="form-control" id="author" required>
                        </div>
                        <div class="mb-3">
                            <label for="isbn" class="form-label">ISBN</label>
                            <input type="text" class="form-control" id="isbn" required>
                        </div>
                        <div class="mb-3">
                            <label for="genre" class="form-label">Genre</label>
                            <select class="form-control" id="genre" required>
                                <option value="">Select Genre</option>
                                <option value="Fiction">Fiction</option>
                                <option value="Non-Fiction">Non-Fiction</option>
                                <option value="Science Fiction">Science Fiction</option>
                                <option value="Mystery">Mystery</option>
                                <option value="Romance">Romance</option>
                                <option value="Biography">Biography</option>
                                <option value="History">History</option>
                                <option value="Poetry">Poetry</option>
                                <option value="Drama">Drama</option>
                                <option value="Fantasy">Fantasy</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" class="form-control" id="quantity" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveBookBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/lms/login.html';
        }

        // Add authorization header to all fetch requests
        const fetchWithAuth = async (url, options = {}) => {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        };

        // Load books
        async function loadBooks() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/books');
                if (response.ok) {
                    const data = await response.json();
                    displayBooks(data.books);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    console.error('Failed to load books');
                }
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Display books
        function displayBooks(books) {
            const booksList = document.getElementById('booksList');
            booksList.innerHTML = books.map(book => `
                <div class="col-md-4 mb-4">
                    <div class="card book-card">
                        <div class="card-body">
                            <h5 class="card-title">${book.title}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${book.author}</h6>
                            <p class="card-text">
                                <strong>ISBN:</strong> ${book.isbn}<br>
                                <strong>Available:</strong> ${book.availableQuantity}/${book.totalQuantity}
                            </p>
                            <button class="btn btn-primary btn-sm" onclick="editBook(${book.bookId})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteBook(${book.bookId})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        let isEditMode = false;
        let currentEditBookId = null;
        const saveBookBtn = document.getElementById('saveBookBtn');

        // Add new book handler
        async function handleAddBook() {
            const book = {
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                isbn: document.getElementById('isbn').value,
                genre: document.getElementById('genre').value,
                totalQuantity: parseInt(document.getElementById('quantity').value),
                availableQuantity: parseInt(document.getElementById('quantity').value)
            };

            try {
                const response = await fetchWithAuth('/lms/api/v1/book', {
                    method: 'POST',
                    body: JSON.stringify(book)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addBookModal')).hide();
                    document.getElementById('addBookForm').reset();
                    loadBooks();
                } else if (response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to add book');
                }
            } catch (error) {
                console.error('Error adding book:', error);
                alert('An error occurred while adding the book');
            }
        }

        // Edit book
        async function editBook(bookId) {
            try {
                const response = await fetchWithAuth(`/lms/api/v1/book/${bookId}`);
                if (response.ok) {
                    const book = await response.json();
                    document.getElementById('title').value = book.title;
                    document.getElementById('author').value = book.author;
                    document.getElementById('isbn').value = book.isbn;
                    document.getElementById('genre').value = book.genre;
                    document.getElementById('quantity').value = book.totalQuantity;

                    // Show the modal
                    const modal = new bootstrap.Modal(document.getElementById('addBookModal'));
                    modal.show();

                    // Switch to edit mode
                    isEditMode = true;
                    currentEditBookId = bookId;
                    saveBookBtn.textContent = 'Update';
                    saveBookBtn.removeEventListener('click', handleAddBook);
                    saveBookBtn.addEventListener('click', handleUpdateBook);
                } else if (response.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to load book details');
                }
            } catch (error) {
                console.error('Error loading book details:', error);
                alert('An error occurred while loading book details');
            }
        }

        // Update book handler
        async function handleUpdateBook() {
            if (!isEditMode || currentEditBookId === null) return;
            const updatedBook = {
                bookId: currentEditBookId,
                title: document.getElementById('title').value,
                author: document.getElementById('author').value,
                isbn: document.getElementById('isbn').value,
                genre: document.getElementById('genre').value,
                totalQuantity: parseInt(document.getElementById('quantity').value),
                availableQuantity: parseInt(document.getElementById('quantity').value)
            };

            try {
                const updateResponse = await fetchWithAuth(`/lms/api/v1/book/${currentEditBookId}`, {
                    method: 'PUT',
                    body: JSON.stringify(updatedBook)
                });

                if (updateResponse.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addBookModal')).hide();
                    document.getElementById('addBookForm').reset();
                    loadBooks();
                    // Reset to add mode
                    isEditMode = false;
                    currentEditBookId = null;
                    saveBookBtn.textContent = 'Save';
                    saveBookBtn.removeEventListener('click', handleUpdateBook);
                    saveBookBtn.addEventListener('click', handleAddBook);
                } else if (updateResponse.status === 403) {
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to update book');
                }
            } catch (error) {
                console.error('Error updating book:', error);
                alert('An error occurred while updating the book');
            }
        }

        // Initial event listener for add
        saveBookBtn.addEventListener('click', handleAddBook);

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            window.location.href = '/lms/login.html';
        });

        // Load books when page loads
        loadBooks();
    </script>
</body>
</html>
