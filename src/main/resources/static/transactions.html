<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .transaction-card {
            transition: transform 0.2s;
        }
        .transaction-card:hover {
            transform: translateY(-5px);
        }
        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Library Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/books.html">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/patrons.html">Patrons</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/lms/transactions.html">Transactions</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Transactions</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
                <i class="bi bi-plus-lg"></i> New Transaction
            </button>
        </div>

        <div class="row" id="transactionsList">
            <!-- Transactions will be loaded here -->
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTransactionForm">
                        <div class="mb-3">
                            <label for="bookId" class="form-label">Book</label>
                            <select class="form-control" id="bookId" required>
                                <!-- Books will be loaded here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="patronId" class="form-label">Patron</label>
                            <select class="form-control" id="patronId" required>
                                <!-- Patrons will be loaded here -->
                            </select>
                        </div>
                        <!-- Status Dropdown -->
                        <div class="mb-3">
                            <label for="status" class="form-label">Status</label>
                            <select class="form-control" id="status" required>
                                <option value="Borrowed" selected>Borrowed</option>
                                <option value="Returned">Returned</option>
                            </select>
                        </div>
                        <!-- Comments Field -->
                        <div class="mb-3">
                            <label for="comments" class="form-label">Comments</label>
                            <textarea class="form-control" id="comments" rows="2" placeholder="Enter any comments..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveTransactionBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/lms/login.html';
        }

        // Add authorization header to all fetch requests
        const fetchWithAuth = async (url, options = {}) => {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        };

        // Lookup maps for book and patron names
        let bookMap = {};
        let patronMap = {};

        // Load books for dropdown and build lookup map
        async function loadBooks() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/books');
                if (response.ok) {
                    const data = await response.json();
                    const bookSelect = document.getElementById('bookId');
                    bookSelect.innerHTML = data.books.map(book => 
                        `<option value="${book.bookId}">${book.title} (${book.author})</option>`
                    ).join('');
                    // Build bookId -> title map
                    bookMap = {};
                    data.books.forEach(book => {
                        bookMap[book.bookId] = book.title;
                    });
                }
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Load patrons for dropdown and build lookup map
        async function loadPatrons() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/patrons');
                if (response.ok) {
                    const data = await response.json();
                    const patronSelect = document.getElementById('patronId');
                    patronSelect.innerHTML = data.patrons.map(patron => 
                        `<option value="${patron.patronId}">${patron.name}</option>`
                    ).join('');
                    // Build patronId -> name map
                    patronMap = {};
                    data.patrons.forEach(patron => {
                        patronMap[patron.patronId] = patron.name;
                    });
                }
            } catch (error) {
                console.error('Error loading patrons:', error);
            }
        }

        // Load transactions
        async function loadTransactions() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/transactions');
                if (response.ok) {
                    const data = await response.json();
                    displayTransactions(data.transactions);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    console.error('Failed to load transactions');
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        // Display transactions with book and patron names
        function displayTransactions(transactions) {
            const transactionsList = document.getElementById('transactionsList');
            transactionsList.innerHTML = transactions.map(transaction => `
                <div class="col-md-4 mb-4">
                    <div class="card transaction-card">
                        <div class="card-body">
                            <h5 class="card-title">${bookMap[transaction.bookId] || 'Book ID: ' + transaction.bookId}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${patronMap[transaction.patronId] || 'Patron ID: ' + transaction.patronId}</h6>
                            <p class="card-text">
                                <strong>Status:</strong> ${transaction.status || ''}<br>
                                <strong>Due Date:</strong> ${transaction.dueDate || ''}<br>
                                <strong>Comments:</strong> ${transaction.comments || ''}
                            </p>
                            <button class="btn btn-primary btn-sm" onclick="editTransaction(${transaction.transactionId})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTransaction(${transaction.transactionId})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        let isEditMode = false;
        let currentEditTransactionId = null;
        const saveTransactionBtn = document.getElementById('saveTransactionBtn');

        // Add new transaction handler
        async function handleAddTransaction() {
            // Collect all required fields, including status and comments
            const transaction = {
                bookId: parseInt(document.getElementById('bookId').value),
                patronId: parseInt(document.getElementById('patronId').value),
                status: document.getElementById('status').value, // Add status from dropdown
                comments: document.getElementById('comments').value // Add comments field
            };

            try {
                const response = await fetchWithAuth('/lms/api/v1/transaction', {
                    method: 'POST',
                    body: JSON.stringify(transaction)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addTransactionModal')).hide();
                    document.getElementById('addTransactionForm').reset();
                    loadTransactions();
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to add transaction');
                }
            } catch (error) {
                console.error('Error adding transaction:', error);
                alert('An error occurred while adding the transaction');
            }
        }

        // Edit transaction
        async function editTransaction(transactionId) {
            try {
                const response = await fetchWithAuth(`/lms/api/v1/transaction/${transactionId}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('bookId').value = data.bookId;
                    document.getElementById('patronId').value = data.patronId;
                    document.getElementById('status').value = data.status || 'Borrowed'; // Set status value
                    document.getElementById('comments').value = data.comments || ''; // Set comments value

                    // Show the modal
                    const modal = new bootstrap.Modal(document.getElementById('addTransactionModal'));
                    modal.show();

                    // Switch to edit mode
                    isEditMode = true;
                    currentEditTransactionId = transactionId;
                    saveTransactionBtn.textContent = 'Update';
                    saveTransactionBtn.removeEventListener('click', handleAddTransaction);
                    saveTransactionBtn.addEventListener('click', handleUpdateTransaction);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    console.error('Failed to load transaction');
                }
            } catch (error) {
                console.error('Error loading transaction:', error);
            }
        }

        // Update transaction handler
        async function handleUpdateTransaction() {
            if (!isEditMode || currentEditTransactionId === null) return;
            const updatedTransaction = {
                transactionId: currentEditTransactionId,
                bookId: parseInt(document.getElementById('bookId').value),
                patronId: parseInt(document.getElementById('patronId').value),
                status: document.getElementById('status').value, // Add status from dropdown
                comments: document.getElementById('comments').value // Add comments field
            };

            try {
                const response = await fetchWithAuth(`/lms/api/v1/transaction/${updatedTransaction.transactionId}`, {
                    method: 'PUT',
                    body: JSON.stringify(updatedTransaction)
                });

                if (response.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addTransactionModal')).hide();
                    document.getElementById('addTransactionForm').reset();
                    loadTransactions();
                    // Reset to add mode
                    isEditMode = false;
                    currentEditTransactionId = null;
                    saveTransactionBtn.textContent = 'Save';
                    saveTransactionBtn.removeEventListener('click', handleUpdateTransaction);
                    saveTransactionBtn.addEventListener('click', handleAddTransaction);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to update transaction');
                }
            } catch (error) {
                console.error('Error updating transaction:', error);
                alert('An error occurred while updating the transaction');
            }
        }

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            window.location.href = '/lms/login.html';
        });

        // Initial event listener for add
        saveTransactionBtn.addEventListener('click', handleAddTransaction);

        // Load data when page loads
        loadBooks();
        loadPatrons();
        loadTransactions();
    </script>
</body>
</html>
