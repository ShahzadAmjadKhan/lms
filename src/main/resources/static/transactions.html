<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Transactions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .transaction-card {
            transition: transform 0.2s;
        }
        .transaction-card:hover {
            transform: translateY(-5px);
        }
        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Library Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/books.html">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/patrons.html">Patrons</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/lms/transactions.html">Transactions</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Transactions</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
                <i class="bi bi-plus-lg"></i> New Transaction
            </button>
        </div>

        <div class="row" id="transactionsList">
            <!-- Transactions will be loaded here -->
        </div>
    </div>

    <!-- Add Transaction Modal -->
    <div class="modal fade" id="addTransactionModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">New Transaction</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addTransactionForm">
                        <div class="mb-3">
                            <label for="bookId" class="form-label">Book</label>
                            <select class="form-control" id="bookId" required>
                                <!-- Books will be loaded here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="patronId" class="form-label">Patron</label>
                            <select class="form-control" id="patronId" required>
                                <!-- Patrons will be loaded here -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="transactionType" class="form-label">Type</label>
                            <select class="form-control" id="transactionType" required>
                                <option value="CHECKOUT">Checkout</option>
                                <option value="RETURN">Return</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveTransactionBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/lms/login.html';
        }

        // Add authorization header to all fetch requests
        const fetchWithAuth = async (url, options = {}) => {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        };

        // Load books for dropdown
        async function loadBooks() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/books');
                if (response.ok) {
                    const data = await response.json();
                    const bookSelect = document.getElementById('bookId');
                    bookSelect.innerHTML = data.books.map(book => 
                        `<option value="${book.bookId}">${book.title} (${book.author})</option>`
                    ).join('');
                }
            } catch (error) {
                console.error('Error loading books:', error);
            }
        }

        // Load patrons for dropdown
        async function loadPatrons() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/patrons');
                if (response.ok) {
                    const data = await response.json();
                    const patronSelect = document.getElementById('patronId');
                    patronSelect.innerHTML = data.patrons.map(patron => 
                        `<option value="${patron.patronId}">${patron.name} (${patron.email})</option>`
                    ).join('');
                }
            } catch (error) {
                console.error('Error loading patrons:', error);
            }
        }

        // Load transactions
        async function loadTransactions() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/transactions');
                if (response.ok) {
                    const data = await response.json();
                    displayTransactions(data.transactions);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    console.error('Failed to load transactions');
                }
            } catch (error) {
                console.error('Error loading transactions:', error);
            }
        }

        // Display transactions
        function displayTransactions(transactions) {
            const transactionsList = document.getElementById('transactionsList');
            transactionsList.innerHTML = transactions.map(transaction => `
                <div class="col-md-4 mb-4">
                    <div class="card transaction-card">
                        <div class="card-body">
                            <h5 class="card-title">${transaction.book.title}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${transaction.patron.name}</h6>
                            <p class="card-text">
                                <strong>Type:</strong> ${transaction.transactionType}<br>
                                <strong>Date:</strong> ${new Date(transaction.transactionDate).toLocaleDateString()}<br>
                                <strong>Status:</strong> ${transaction.status}
                            </p>
                            <button class="btn btn-primary btn-sm" onclick="editTransaction(${transaction.transactionId})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteTransaction(${transaction.transactionId})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add new transaction
        document.getElementById('saveTransactionBtn').addEventListener('click', async function() {
            const transaction = {
                bookId: parseInt(document.getElementById('bookId').value),
                patronId: parseInt(document.getElementById('patronId').value),
                transactionType: document.getElementById('transactionType').value
            };

            try {
                const response = await fetchWithAuth('/lms/api/v1/transaction', {
                    method: 'POST',
                    body: JSON.stringify(transaction)
                });

                if (response.ok) {
                    $('#addTransactionModal').modal('hide');
                    document.getElementById('addTransactionForm').reset();
                    loadTransactions();
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to add transaction');
                }
            } catch (error) {
                console.error('Error adding transaction:', error);
                alert('An error occurred while adding the transaction');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            window.location.href = '/lms/login.html';
        });

        // Load data when page loads
        loadBooks();
        loadPatrons();
        loadTransactions();
    </script>
</body>
</html>
