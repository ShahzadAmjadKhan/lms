<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System - Patrons</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .patron-card {
            transition: transform 0.2s;
        }
        .patron-card:hover {
            transform: translateY(-5px);
        }
        .navbar {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Library Management System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/books.html">Books</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/lms/patrons.html">Patrons</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/lms/transactions.html">Transactions</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="logoutBtn">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Patrons</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addPatronModal">
                <i class="bi bi-plus-lg"></i> Add Patron
            </button>
        </div>

        <div class="row" id="patronsList">
            <!-- Patrons will be loaded here -->
        </div>
    </div>

    <!-- Add Patron Modal -->
    <div class="modal fade" id="addPatronModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Patron</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addPatronForm">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="savePatronBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = '/lms/login.html';
        }

        // Add authorization header to all fetch requests
        const fetchWithAuth = async (url, options = {}) => {
            const headers = {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json',
                ...options.headers
            };
            return fetch(url, { ...options, headers });
        };

        // Load patrons
        async function loadPatrons() {
            try {
                const response = await fetchWithAuth('/lms/api/v1/patrons');
                if (response.ok) {
                    const data = await response.json();
                    displayPatrons(data.patrons);
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    console.error('Failed to load patrons');
                }
            } catch (error) {
                console.error('Error loading patrons:', error);
            }
        }

        // Display patrons
        function displayPatrons(patrons) {
            const patronsList = document.getElementById('patronsList');
            patronsList.innerHTML = patrons.map(patron => `
                <div class="col-md-4 mb-4">
                    <div class="card patron-card">
                        <div class="card-body">
                            <h5 class="card-title">${patron.name}</h5>
                            <h6 class="card-subtitle mb-2 text-muted">${patron.email}</h6>
                            <p class="card-text">
                                <strong>Phone:</strong> ${patron.phone}<br>
                                <strong>Status:</strong> ${patron.status}
                            </p>
                            <button class="btn btn-primary btn-sm" onclick="editPatron(${patron.patronId})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deletePatron(${patron.patronId})">Delete</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Add new patron
        document.getElementById('savePatronBtn').addEventListener('click', async function() {
            const patron = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value
            };

            try {
                const response = await fetchWithAuth('/lms/api/v1/patron', {
                    method: 'POST',
                    body: JSON.stringify(patron)
                });

                if (response.ok) {
                    $('#addPatronModal').modal('hide');
                    document.getElementById('addPatronForm').reset();
                    loadPatrons();
                } else if (response.status === 403) {
                    // Token expired or invalid, redirect to login
                    localStorage.removeItem('token');
                    window.location.href = '/lms/login.html';
                } else {
                    alert('Failed to add patron');
                }
            } catch (error) {
                console.error('Error adding patron:', error);
                alert('An error occurred while adding the patron');
            }
        });

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('token');
            window.location.href = '/lms/login.html';
        });

        // Load patrons when page loads
        loadPatrons();
    </script>
</body>
</html>
